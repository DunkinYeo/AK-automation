platform: android
run:
  name: "ak_longrun"
  duration_hours: 72          # adjust to actual study duration (max 720 = 30 days)
  symptom_interval_hours: 1   # injection interval: 1 / 2 / 4 hours
  start_immediately: true     # run first injection immediately on start
  jitter_seconds: 0           # random jitter per injection (seconds)
  quiet_hours:
    start: 2                  # skip injections from 2:00–6:00 (set to 0 to disable)
    end: 6
  bt_disconnect_interval_hours: 1   # BT disconnect test interval (0 = disabled)
  bt_disconnect_minutes: 10         # how long BT stays off each cycle
  airplane_mode_interval_hours: 1   # airplane mode test interval (0 = disabled, USB only)
  airplane_mode_minutes: 5          # how long airplane mode stays on each cycle

recovery:
  cooldown_seconds_between_steps: 30

symptom_catalog:
  symptoms:
    - "Chest pain / discomfort"
    - "Shortness of breath"
    - "Dizziness"
    - "Fainting"
    - "Palpitations / Heart pounding"
    - "Nausea"

android:
  appium_server_url: "http://127.0.0.1:4723"
  device_name: "Pixel 7"
  udid: "55ETQWBXYE1RA1"
  test_serial_number: "670469"
  search_serial: "670469"
  app_package: "com.wellysis.accurkardia.accurkardia.mobile"
  app_activity: "com.wellysis.accurkardia.accurkardia.mobile.MainActivity"
  no_reset: true
  new_command_timeout: 3600
  appium_http_timeout: 120   # seconds before a stalled Appium HTTP call aborts

selectors:
  android:
    # main measurement screen health check
    symptom_add_text: "Add Diary"

    # Step 1 — Serial Number input
    serial_input_hint: "Enter the Serial Number here."
    connect_button_text: "Connect"

    # Step 2 — Check Incoming Signal
    check_signal_title: "Check Incoming Signal"
    live_streaming_text: "Live Streaming"
    continue_button_text: "Continue"

    # Step 3 — Review Study Setting
    review_study_title: "Review Study Setting"
    registered_study_text: "Registered Study"

    # Start Study screen
    start_study_button_text: "Start Study"
    network_status_text: "Network"
    bluetooth_status_text: "Bluetooth"
    battery_status_text: "Battery"
    patch_placement_text: "Patch Placement"

    # Measurement main screen (AK)
    main_screen_text: "My Study Progress"
    log_symptoms_button_text: "Log Symptoms"
    device_status_tab_text: "Device Status"
    realtime_ecg_tab_text: "Real-time ECG"
    symptom_add_text: "Log Symptoms"   # UI health indicator — button visible on main screen

    # Log Symptoms sheet (AK — no Activity section)
    symptom_section_text: "Symptom"
    log_symptoms_submit_text: "Save"

    # Error popups
    no_study_info_title: "No Study Information"
    confirm_button_text: "Confirm"

    # AK connection error popups
    cannot_find_patch_title: "Cannot find your S-Patch"   # device not found (code 950)
    reset_patch_title: "Reset your S-Patch"               # reset required (code 963)
